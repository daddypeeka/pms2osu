name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MinGW-w64)
            os: windows-latest
            artifact_name: pms2osu-v2-windows
            binary_path: dist/pms2osu-v2.exe

          - name: macOS
            os: macos-latest
            artifact_name: pms2osu-v2-macos
            binary_path: dist/pms2osu-v2-macos

          - name: Linux
            os: ubuntu-latest
            artifact_name: pms2osu-v2-linux
            binary_path: dist/pms2osu-v2-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libglfw3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Stage binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/pms2osu-v2 "${{ matrix.binary_path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release files
        run: find artifacts -maxdepth 2 -type f

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pms2osu-v2-windows/pms2osu-v2.exe
            artifacts/pms2osu-v2-macos/pms2osu-v2-macos
            artifacts/pms2osu-v2-linux/pms2osu-v2-linux
          generate_release_notes: true
