name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- x64 (64-bit Intel/AMD, the default) ----
          - name: Windows x64 (MinGW-w64)
            os: windows-latest
            arch: x64
            msystem: MINGW64
            msys_packages: >-
              mingw-w64-x86_64-gcc
              make
            build_system: make
            artifact_name: pms2osu-v2-windows-x64
            binary_path: dist/pms2osu-v2-windows-x64.exe

          - name: macOS x64 (Intel)
            os: macos-13
            arch: x64
            artifact_name: pms2osu-v2-macos-x64
            binary_path: dist/pms2osu-v2-macos-x64

          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            artifact_name: pms2osu-v2-linux-x64
            binary_path: dist/pms2osu-v2-linux-x64

          # ---- x86 (32-bit) ----
          - name: Windows x86 (MinGW-w32)
            os: windows-latest
            arch: x86
            msystem: MINGW32
            # MSYS2 ships no mingw-w64-i686-glfw package, so GLFW is built
            # from source below (git is used to fetch it).
            msys_packages: >-
              mingw-w64-i686-gcc
              make
              cmake
              git
            build_system: cmake
            artifact_name: pms2osu-v2-windows-x86
            binary_path: dist/pms2osu-v2-windows-x86.exe

          - name: Linux x86 (i386)
            os: ubuntu-latest
            arch: x86
            build_system: docker
            artifact_name: pms2osu-v2-linux-x86
            binary_path: dist/pms2osu-v2-linux-x86

          # ---- arm64 (Apple Silicon / ARM64 Linux) ----
          - name: macOS arm64 (Apple Silicon)
            os: macos-14
            arch: arm64
            artifact_name: pms2osu-v2-macos-arm64
            binary_path: dist/pms2osu-v2-macos-arm64

          - name: Linux arm64
            os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: pms2osu-v2-linux-arm64
            binary_path: dist/pms2osu-v2-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys_packages }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && matrix.build_system != 'docker'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libglfw3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      - name: Build (Windows, Make)
        if: runner.os == 'Windows' && matrix.build_system == 'make'
        shell: msys2 {0}
        run: make

      - name: Build GLFW (Windows 32-bit, from source)
        if: runner.os == 'Windows' && matrix.build_system == 'cmake'
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git third_party/glfw-src
          # Force "MSYS Makefiles" so CMake keeps WIN32=TRUE. The default
          # generator in MSYS2 MINGW32 may be "Unix Makefiles", which makes
          # GLFW try to build the X11/Wayland backend and fail.
          cmake -S third_party/glfw-src -B glfw-build -G "MSYS Makefiles" \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_INSTALL=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=glfw-prefix
          cmake --build glfw-build -j
          cmake --install glfw-build

      - name: Build (Windows, CMake / 32-bit)
        if: runner.os == 'Windows' && matrix.build_system == 'cmake'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DPMS2OSU_USE_BUNDLED_GLFW=OFF \
            -DPMS2OSU_GLFW_ROOT="$PWD/glfw-prefix"
          cmake --build build --config Release -j

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows' && matrix.build_system != 'docker'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Build (Linux x86 in i386 container)
        if: runner.os == 'Linux' && matrix.build_system == 'docker'
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD":/src -w /src \
            i386/debian:bookworm-slim bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends cmake build-essential libglfw3-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release -j
            '

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          if [ -f dist/pms2osu-v2.exe ]; then
            mv dist/pms2osu-v2.exe "${{ matrix.binary_path }}"
          else
            mv build/pms2osu-v2.exe "${{ matrix.binary_path }}"
          fi

      - name: Stage binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/pms2osu-v2 "${{ matrix.binary_path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release files
        run: find artifacts -maxdepth 2 -type f

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pms2osu-v2-windows-x64/pms2osu-v2-windows-x64.exe
            artifacts/pms2osu-v2-windows-x86/pms2osu-v2-windows-x86.exe
            artifacts/pms2osu-v2-macos-x64/pms2osu-v2-macos-x64
            artifacts/pms2osu-v2-linux-x64/pms2osu-v2-linux-x64
            artifacts/pms2osu-v2-linux-x86/pms2osu-v2-linux-x86
            artifacts/pms2osu-v2-macos-arm64/pms2osu-v2-macos-arm64
            artifacts/pms2osu-v2-linux-arm64/pms2osu-v2-linux-arm64
          generate_release_notes: true
